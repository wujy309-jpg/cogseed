# Gitleaks >= 8.25: retain all default rules. Each reviewed exception matches
# a specific rule, one exact file path, AND one exact synthetic value.
# Never exempt an entire test/vendor directory or a whole commit.
title = "CogSeed reviewed synthetic fixtures"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test data for credential detection, redaction, or sandbox isolation"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)src/core\-agent/test/tools\.test\.ts$''']
regexes = [
  '''^\Qpropagated-abc123\E$''',
]

[[allowlists]]
description = "Unmodified xterm export expression, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)src/renderer/vendor/xterm/xterm\.js$''']
regexes = [
  '''^\Qt.TwoKeyMap=void\E$''',
]

