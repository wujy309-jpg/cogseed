[[allowlists]]
description = "Reviewed fixed detector patterns or synthetic test fixtures (2026-10-10)"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)resources/guardrail/skill\-sentry/engine/rulesets/v1\.1\.0/secret\-patterns\.yaml$''']
regexes = [
  '''^\Q-----BEGIN OPENSSH PRIVATE KEY-----'
    severity: critical
    confidence: high
  - id: pgp_private_key
    pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----\E$''',
  '''^\Q-----BEGIN PRIVATE KEY-----'
    severity: critical
    confidence: high
  - id: google_oauth_client_secret
    pattern: 'GOCSPX-[A-Za-z0-9_\-]{28,}'
    severity: critical
    confidence: high
  - id: azure_storage_connection_string
    pattern: 'DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{40,}'
    severity: critical
    confidence: high
  - id: azure_client_secret
    pattern: '(?:AZURE_CLIENT_SECRET|client_secret)["'']?\s*[:=]\s*["'']?[A-Za-z0-9_\-\.~]{30,}'
    severity: high
    confidence: medium
  - id: aliyun_access_key
    pattern: 'LTAI[A-Za-z0-9]{12,20}'
    severity: high
    confidence: medium
  - id: tencent_secret_id
    pattern: 'AKID[A-Za-z0-9]{13,20}'
    severity: high
    confidence: medium
  - id: digitalocean_token
    pattern: 'dop_v1_[A-Za-z0-9]{64}'
    severity: critical
    confidence: high

  # ---- 私钥块 ----
  - id: private_key_block
    pattern: '-----BEGIN .*PRIVATE KEY-----\E$''',
]

