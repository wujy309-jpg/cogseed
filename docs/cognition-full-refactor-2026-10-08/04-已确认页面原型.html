/* CogSeed open-source design-system tokens.
 *
 * The independent opensource-design-system package is the visual reference;
 * this file is the production token seam for the classic Electron renderer.
 * Existing aliases remain available so business pages can migrate gradually.
 */

:root {
  /* Base colors */
  --color-brand: #0E9F6E;
  --color-brand-hover: #0A7A55;
  --color-brand-soft: #E2F5EC;
  --color-accent-wash: rgba(14, 159, 110, 0.09);
  --color-accent: #0A7A55;
  --color-accent-hover: #086545;
  --color-accent-gradient: linear-gradient(135deg, #0A7A55, #086545);
  --color-ink: #14281E;
  --color-ink-body: #243D30;
  --color-ink-2: #3E5A4C;
  --color-ink-3: #4C685A;
  --color-muted: #5C7064; /* WCAG：浅底(#edf3ef)上需 ≥4.5，#5E7467 为 4.48，最小加深一档（白底 4.93→5.31） */
  --color-faint: #9CAEA2;
  --color-line-subtle: rgba(20, 40, 30, 0.06);
  --color-line-hairline: rgba(20, 40, 30, 0.07);
  --color-line: rgba(20, 40, 30, 0.09);
  --color-line-field: rgba(20, 40, 30, 0.12);
  --color-line-strong: rgba(20, 40, 30, 0.14);
  --color-line-control: rgba(20, 40, 30, 0.22);
  --color-surface: #FFFFFF;
  --color-surface-2: #EDF3EF;
  --color-surface-3: #DCE5DF;
  --color-surface-subtle: #F7FAF8;
  --color-sidebar-top: #F4F8F5;
  --color-sidebar-bottom: #EDF3EF;
  --color-surface-4: #FAFCFB;
  --color-border-soft: #E3EAE6;
  --color-bg: #FBFDFC;
  --color-black: #000000;
  --color-white: #FFFFFF;
  --color-white-55: rgba(255, 255, 255, 0.55);
  --color-shadow-soft: rgba(0, 0, 0, 0.2);
  --color-success: #1E6E4E;
  --color-success-soft: #E8F1EC;
  --color-warning: #B5761F;
  --color-warning-soft: #FBF1E2;
  --color-warning-text: #8A5A14;
  --color-danger: #A33A2B;
  --color-danger-hover: #8A3024;
  --color-danger-soft: #F8EBE8;
  --color-danger-line: rgba(163, 58, 43, 0.28);
  --color-danger-action-hover: rgba(163, 58, 43, 0.08);
  --color-control-stop: #5B6470;
  --color-control-stop-hover: #46505B;
  --color-scrim: rgba(20, 40, 30, 0.28);
  /* Command palettes share the modal scrim; the separate alias remains for
     compatibility with older gallery and business-page selectors. */
  --color-command-scrim: var(--color-scrim);
  --color-focus-halo: rgba(14, 159, 110, 0.12);
  --color-overlay-hover: rgba(20, 40, 30, 0.05);
  --color-overlay-fill: rgba(20, 40, 30, 0.06);
  --color-overlay-disabled: rgba(20, 40, 30, 0.08);
  --color-grid-line: rgba(14, 159, 110, 0.035);
  --color-home-background:
    radial-gradient(700px 430px at 88% -6%, rgba(14, 159, 110, 0.15) 0%, rgba(14, 159, 110, 0) 70%),
    radial-gradient(540px 390px at 10% 6%, rgba(66, 184, 130, 0.10) 0%, rgba(66, 184, 130, 0) 72%),
    linear-gradient(180deg, rgba(237, 248, 241, 0.95) 0%, rgba(255, 255, 255, 0) 48%);
  --color-info: #2563EB;
  --color-info-soft: #EAF2F8;
  --color-violet: #8B5CF6;
  --color-violet-soft: #C084FC;
  --color-teal: #0D706C;
  --color-overlay-ink: #0F172A;
  --color-shadow-ink: #144737;
  --color-shadow-run: #1C3026;

  /* Typography: local system fonts only. */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --font-size-1: 11px;
  --font-size-2: 12px;
  --font-size-3: 13px;
  --font-size-4: 14px;
  --font-size-5: 16px;
  --font-size-6: 20px;
  --font-size-display: 32px;
  --font-size-body: 15px;
  --font-size-body-lg: 16px;
  --font-size-caption: 12.5px;
  --font-size-ui: 14px;
  --font-size-ui-sm: 13px;
  --font-size-meta: 12px;
  --font-size-label: 12px;
  --font-size-numeric: 13px;
  --font-size-title: 15px;
  --font-size-dialog-title: 18px;
  --font-size-heading: 22px;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.2;
  --line-height-row: 1.35;
  --line-height-title: 1.4;
  --line-height-body: 1.6;
  --tracking-display: -0.025em;
  --tracking-title: -0.01em;
  --tracking-normal: 0;

  /* 4px spacing grid. */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 52px;
  --space-page: 88px;

  /* Base radii and semantic radius aliases. */
  --radius-1: 6px;
  --radius-2: 8px;
  --radius-3: 12px;
  --radius-pill: 999px;
  --radius-xs: 4px;
  --radius-sm: 7px;
  --radius-field: 9px;
  --radius-item: 10px;
  --radius-popover: 11px;
  --radius-window: 14px;
  --radius-chip: var(--radius-xs);
  --radius-icon-button: var(--radius-sm);
  --radius-control: var(--radius-2);
  --radius-card: var(--radius-3);
  --radius-dialog: var(--radius-window);

  /* Layout and control metrics from the open-source reference. */
  --layout-sidebar-width: 280px;
  --layout-titlebar-height: 52px;
  --layout-thread-width: 760px;
  --layout-thread-home-width: 720px;
  --layout-composer-width-min: 480px;
  --layout-composer-width-max: 900px;
  --layout-resource-detail-width: 880px;
  --layout-info-panel-width: 308px;
  --layout-settings-nav-width: 224px;
  --layout-card-grid-width: 1232px;
  --card-width-min: 280px;
  --card-grid-gap: var(--space-4);
  --card-width-max: 400px;
  --card-grid-width-max: var(--layout-card-grid-width);
  --control-height-sm: 28px;
  --control-height: 32px;
  --control-height-lg: 36px;
  --icon-size: 16px;
  --row-height-nav: 36px;
  --row-height-list: 34px;
  --row-height-table: 44px;


  /* ── Process-stream palette (chat-stream 活动流；PR209 P0-4 token 化) ── */
  --color-stream-ink: #1f2937;          /* 正文主色（浅色） */
  --color-stream-dim: #bcc2cc;          /* 次要说明文字 */
  --color-stream-chip: #8b93a0;         /* 徽章/暗色次要 */
  --color-stream-chip-2: #a6adb8;       /* 图标/动词（暗色） */
  --color-stream-target: #99a1ac;       /* 目标文本 */
  --color-stream-think: #9aa2ad;        /* 思考正文 */
  --color-stream-dir: #6d7480;          /* 目录/暗色弱化 */
  --color-stream-muted: #6f7883;        /* 加载/弱动词 */
  --color-stream-pale: #b9c0ca;         /* 最弱提示 */
  --color-stream-fail: #D64545;         /* 失败动词 */
  --color-stream-fail-2: #B92222;       /* 失败重音 */
  --color-stream-fail-3: #B22222;       /* 失败边框（旧值 rgb(178,34,34)） */
  --color-stream-ok: #16803D;           /* 成功（旧值 rgb(22,128,61)） */
  --color-stream-warn: #CA8A04;         /* 审批/警告（旧值 rgb(202,138,4)） */
  --color-stream-hover: rgba(127, 127, 127, .07);
  --color-stream-guide: rgba(127, 127, 127, .22);   /* 输出块竖线 */
  --color-stream-guide-2: rgba(127, 127, 127, .18); /* 思考全文竖线 */
  --color-stream-guide-3: rgba(127, 127, 127, .35); /* 展开箭头底 */
  --color-stream-sel: rgba(34, 197, 94, .1);
  --color-stream-btn: rgba(255, 255, 255, .6);
  --color-stream-dark-hover: rgba(255, 255, 255, .06);
  --color-stream-dark-line: rgba(255, 255, 255, .16);
  --color-stream-dark-line-2: rgba(255, 255, 255, .22);
  --color-stream-dark-btn: rgba(255, 255, 255, .06);
  --color-stream-dark-ink: #c8cdd5;
  --color-stream-dark-card: rgba(255, 255, 255, .04);
  --color-stream-dark-deep: rgba(0, 0, 0, .28);
  --color-stream-danger-line: rgba(220, 38, 38, .32);
  --color-stream-danger-bg: rgba(220, 38, 38, .06);

  --color-stream-hover-2: rgba(127, 127, 127, .09);
  --color-stream-hover-3: rgba(127, 127, 127, .1);
  --color-stream-ok-2: #1A7F37;
  --color-stream-fail-4: #CF222E;
  --color-stream-fail-bg: rgba(239, 68, 68, .08);
  --color-stream-overlay: rgba(0, 0, 0, .05);
  --color-stream-white: #FFFFFF;
  --color-stream-ok-3: #16A34A;
  --color-stream-danger: #DC2626;
  --color-stream-dark-hover-2: rgba(255, 255, 255, .07);
  --color-stream-fallback: #E5E7EB;

  /* ── Cognition assets palette（认知资产页专属配色，2026-09-14 从
        cognition-assets.css 上移到 tokens.css。值与原字面量逐一对齐；
        同族微差色（Δ≤8/255）合并为同一 token，肉眼不可辨。图示四层用的
        土壤/根/枝/冠配色也在这里。新样式请引用这些 token，不要再写字面量。） ── */
  --color-ca-green: #189a5c;
  --color-ca-green-deep: #0f7a47;
  --color-ca-green-text: #1c7d50;
  --color-ca-green-text-deep: #116b40;
  --color-ca-green-bg: #e9f5ee;          /* 合并 #eaf5ee */
  --color-ca-green-fill: #ddf0e4;        /* 合并 #dcecdf */
  --color-ca-green-line: #8fcfae;
  --color-ca-green-line-2: #cfe7d7;      /* 合并 #cfe0d4 */
  --color-ca-green-line-3: #c6dfcd;      /* 合并 #cbe6d3 */
  --color-ca-green-mid: #7a9b88;
  --color-ca-green-dim: #6f8378;
  --color-ca-ink: #1d1f1e;
  --color-ca-ink-2: #54595e;             /* 合并 #5c6166 */
  --color-ca-ink-3: #8a9098;
  --color-ca-ink-4: #9aa0a6;
  --color-ca-ink-faint: #b7bdb7;
  --color-ca-dot-empty: #c9ccc9;
  --color-ca-line: #e8eae8;
  --color-ca-line-dim: #e6e6e2;          /* 合并 #e2e6e2 / #ececea */
  --color-ca-fill-empty: #eef1ee;
  --color-ca-paper: #fafaf9;             /* 合并 #f7f7f5 / #fbfbfa / #fbfcfa */
  --color-ca-hover: #f6f8f6;
  --color-ca-chip-bg: #f1f2f0;
  --color-ca-amber-bg: #fdf6e7;
  --color-ca-amber-ink: #96690f;
  --color-ca-amber-ink-2: #8a6717;
  --color-ca-amber-ink-3: #6d5417;
  --color-ca-amber-line: #f0dcb2;        /* 合并 #ecd9b0 */
  --color-ca-amber-hover: #faeecf;
  --color-ca-amber-dot: #e2a33f;
  --color-ca-soil: #ece4d6;
  --color-ca-soil-line: #ddd0ba;
  --color-ca-soil-hover: #e4d8c2;
  --color-ca-soil-ink: #6f5a3a;
  --color-ca-red: #ce4840; /* WCAG：白字需 ≥4.5，#cf4a42 为 4.46，最小加深一档 */
  --color-ca-red-line: #ecc8c4;
  --color-ca-red-bg: #fdf0ef;
  --color-ca-row-hover: rgba(0, 0, 0, 0.03);

function graphControls(mid){return `<div class="bar"><div class="chips">${b('具体对象','o-graph-scale','objects',graphScale==='objects'?'on':'')}${b('概念结构','o-graph-scale','schema',graphScale==='schema'?'on':'')}</div><select id="o-graph-relation" style="width:170px"><option>全部</option>${moduleRecords(mid,'relation').map(r=>`<option ${graphRelation===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select><label class="choice">查询日期 <input type="date" id="o-query-date" value="${ontologyDate}"></label>${b('−','o-zoom','out')}${b('恢复全景','o-zoom','reset')}${b('＋','o-zoom','in')}</div>`}

        </g>`;
      });
      const count = catCount(branch.id);
      g += `<rect x="${end.x - 84}" y="${end.y - 73}" width="168" height="43" rx="12" class="branch-plate"/>

    return `<svg id="ca-tree-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(T('cognition.tree_panel_title', '我的认知树'))}">${g}</svg>`;
  }

else if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify({...db,backup:null},null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='CogSeed-演示数据.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
else if(a==='chat')chatModal();else if(a==='chat-run')chatRun();else if(a==='chat-local'){$('#chat-result').insertAdjacentHTML('beforeend','<div class="bubble">只调整本次安排，长期内容未改变；下一次任务仍使用原默认。</div>')}
else if(a==='chat-long'){const x=asset('table');update(x,'比较方案时以文字解释为主，必要时补充表格。',x.scope,x.title,'用户明确调整未来默认');render();$('#chat-result').insertAdjacentHTML('beforeend','<div class="bubble">已修改长期偏好。新任务使用新版，旧示例依据仍保留。</div>')}
else if(a==='chat-history'){const last=db.lastChat;if(!last)return;const x=asset(last.asset);modal('本次依据 · v'+last.version,`<div class="note">${x.status==='paused'?'内容当前已暂停，不能据历史绕过使用限制。':'旧示例保存当时版本，不静默替换为最新版。'}</div><h3 style="margin:15px 0">${esc(x.title)}</h3><p class="bodytext">${esc(last.body)}</p><p class="muted">演示读取记录，不证明真实采用或效果。</p>`)}});
function refreshSearchResults(){const temp=document.createElement('div');temp.innerHTML=listOnly(renderAssets());const fresh=temp.querySelector('.workspace,.tree'),old=$('#page .workspace,#page .tree');if(fresh&&old)old.replaceWith(fresh);if(route==='activity'){const count=temp.querySelector('.bar small');const oldCount=$('#page .bar small');if(count&&oldCount)oldCount.textContent=count.textContent}}

document.addEventListener('input',e=>{if(e.isComposing)return;if(e.target.id==='asset-search'){query=e.target.value;refreshSearchResults()}if(e.target.id==='change-search'){activitySearch=e.target.value;$('#activity-list-body').innerHTML=activityRowsHtml()}if(e.target.id==='ontology-search'){ontologySearch=e.target.value;$('#ontology-list-body').innerHTML=ontologyDirectory()}if(e.target.id==='ontology-content-search'){contentSearch=e.target.value;const pos=e.target.selectionStart;render();const n=$('#ontology-content-search');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='nightly-setting')settingsDraft.auto=el.checked;if(el.id==='o-query-date'){ontologyDate=el.value||'2026-10-08';render()}if(el.id==='o-graph-relation'){graphRelation=el.value;render()}if(el.id==='o-import-file'){const f=el.files[0];if(f){if(f.size>1024*1024)return error('演示文件限制为 1MB');$('#o-import-text').value=await f.text()}}if(el.id==='default-setting')settingsDraft.defaultUse=el.checked;if(el.id==='import-file'){const f=el.files[0];if(f){if(!/\.(md|txt)$/i.test(f.name))return error('本原型仅实际解析 TXT／Markdown。');if(f.size>1024*1024)return error('演示文件限制为 1MB。');$('#import-text').value=await f.text()}}});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.key==='Escape'&&$('#overlay').children.length){e.preventDefault();close()}else if(e.key==='Tab'&&$('#overlay').children.length){const nodes=[...$('#overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,[tabindex="0"]')].filter(n=>n.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-action]')){e.preventDefault();e.target.click()}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(['treepage','assets','ontology','review','activity','settings'].includes(r))navigate(r)});window.demoState=()=>clone(db);if(['treepage','assets','ontology','review','activity','settings'].includes(location.hash.slice(1)))route=location.hash.slice(1)==='review'?'activity':location.hash.slice(1);render();
</script></body></html>
