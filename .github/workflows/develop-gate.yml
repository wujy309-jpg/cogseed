name: Develop Gate

# Private hosted minutes are billable. Static checks avoid native downloads;
# package/lockfile changes make module-graph selection run the whole suite.
# Keep hosted PR validation static; full tests run locally/self-hosted and publicly.
# Full platform acceptance happens on the reviewed public snapshot.

on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# 同一个 PR 连续 push 时，取消上一次未跑完的，省时间也省额度。
concurrency:
  group: develop-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-gates:
    if: github.repository == 'bonc-ai/cogseed-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # 以下五项在 1.1.2 实测里合计约 1.5 分钟
      # （typecheck 0.2 / lint 0.4 / 其余各 0.0）
      - run: npm run typecheck
      - run: npm run lint
      - name: Design-token gate
        run: npm run tokens:check
      - name: Class-name consistency gate
        run: npm run class-names:check
      - name: Builtin manifest gate
        run: npm run builtin:manifest:check
      - name: README link gate
        run: npm run readme:check
      - name: Community Skill candidate gate
        run: npm run community:skills:check
      - name: Export and workflow contracts
        run: node --test scripts/opensource/*.test.mjs
      # 2026-09-20 新增：硬跳过（it/test/describe.skip）必须逐条登记在
      # test/skip-allowlist.json，未登记的一律判失败。放在 L1 是为了在**源头**
      # 挡住"用 skip 静音"——nightly 里的同名步骤（同一份脚本）作为 L2 兜底。
      - name: Skip 残留检查（硬跳过必须登记）
        run: node scripts/check-skipped-tests.mjs --strict
