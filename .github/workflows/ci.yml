name: CI

# Private hosted minutes are billable (including cicd). This gate only qualifies
# a candidate for export; public-ci.yml owns full tests and package validation.
on:
  pull_request:
    branches:
      - cicd
  push:
    branches:
      - cicd

concurrency:
  group: private-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'bonc-ai/cogseed-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Export and workflow contracts (no native runtime)
        run: node --test scripts/opensource/*.test.mjs
      - run: node scripts/check-skipped-tests.mjs --strict
      - run: npm run readme:check
      - run: npm run community:skills:check
      - run: npm run tokens:check
      - run: npm run builtin:manifest:check
      - name: Email hygiene gate (release gate)
        if: github.event_name == 'push' || github.base_ref == 'cicd'
        run: |
          set -euo pipefail
          # Author allowlist: GitHub noreply + team address. The two historical
          # author-header exceptions were retired once cicd absorbed their commits
          # (see .github/workflows/email-gate.yml). Mergers must enable
          # "Keep my email addresses private" — see CONTRIBUTING.md item 4.
          bad=$(git log --format='%h|%an|%ae' "origin/cicd..HEAD" 2>/dev/null \
            | grep -vE '\|([0-9]+\+[^@]+@users\.noreply\.github\.com|business@bonc\.com\.cn)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits to cicd contain non-noreply author emails:"
            echo "$bad"
            exit 1
          fi
          echo "✅ All commit author emails are noreply."
          # Bodies / Co-authored-by trailers are public record too (#184 leak).
          bad_msg=$(git log --format='%h|%B' "origin/cicd..HEAD" 2>/dev/null \
            | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            | grep -viE '^([0-9]+\+[^@]+@users\.noreply\.github\.com|business@bonc\.com\.cn|support@github\.com)$' \
            | sort -u || true)
          if [ -n "$bad_msg" ]; then
            echo "::error::Commit messages / Co-authored-by contain non-allowlisted emails:"
            echo "$bad_msg"
            exit 1
          fi
          echo "✅ Commit messages and Co-authored-by trailers are clean."
