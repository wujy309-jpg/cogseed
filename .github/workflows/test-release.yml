name: Test Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: cicd
        type: string
      label:
        description: Test artifact label
        required: true
        default: test-v1.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: test-release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    if: github.repository == 'bonc-ai/cogseed-internal'
    runs-on: [self-hosted, macOS, cogseed-internal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create temporary keychain
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      - run: node scripts/write-build-info.cjs --channel=release
        env:
          COGSEED_HUB_API_BASE: ${{ vars.COGSEED_HUB_API_BASE_URL }}
      - name: Build and notarize test package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx json -I -f package.json -e 'this.build.mac.notarize = true'
          npx json -I -f package.json -e 'this.build.asarUnpack = this.build.asarUnpack || []'
          npx json -I -f package.json -e 'this.build.files.push("!**/archive/**")'
          npx json -I -f package.json -e 'this.build.files.push("!**/*.tar.gz")'
          npx electron-builder --mac --publish never
      - name: Verify packaged build metadata
        run: |
          npm run verify:package:build-info -- \
            --channel=release \
            --app=dist/mac-arm64/CogSeed.app \
            --app=dist/mac/CogSeed.app
      - name: Verify macOS test package
        run: |
          node scripts/check-fuses.cjs dist/mac-arm64/CogSeed.app dist/mac/CogSeed.app
          npm run verify:package:launch
      - uses: actions/upload-artifact@v4
        with:
          name: CogSeed-${{ inputs.label }}-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

  build-windows:
    if: github.repository == 'bonc-ai/cogseed-internal'
    runs-on: [self-hosted, Windows, cogseed-internal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/write-build-info.cjs --channel=release
        env:
          COGSEED_HUB_API_BASE: ${{ vars.COGSEED_HUB_API_BASE_URL }}
      - run: npm run build:win
      - name: Verify packaged build metadata
        run: npm run verify:package:build-info -- --channel=release
      - name: Verify Windows test package
        run: |
          npm run verify:package:launch
          npm run verify:package:stt:win
          node scripts/check-fuses.cjs dist/win-unpacked/CogSeed.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CogSeed-${{ inputs.label }}-Windows
          path: dist/CogSeed-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14
